<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#111417">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>GymLog — дневник тренировок</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-title" content="GymLog">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="app"></main>

<div id="rest" hidden>
  <div class="rest-bar"><i id="rest-fill"></i></div>
  <div class="rest-row">
    <b id="rest-time"></b>
    <button data-a="restAdd" data-v="-15">−15</button>
    <button data-a="restAdd" data-v="15">+15</button>
    <button data-a="restStop">Пропустить</button>
  </div>
</div>

<nav id="tabs">
  <a href="#/workouts" data-tab="workouts">
    <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>Сегодня</a>
  <a href="#/programs" data-tab="programs">
    <svg viewBox="0 0 24 24"><path d="M3 10v4M6 7v10M18 7v10M21 10v4M6 12h12"/></svg>Программы</a>
  <a href="#/exercises" data-tab="exercises">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>Упражнения</a>
  <a href="#/progress" data-tab="progress">
    <svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l3-4 3 2 4-6"/></svg>Прогресс</a>
  <a href="#/more" data-tab="more">
    <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>Ещё</a>
</nav>

<div id="modal" hidden></div>
<div id="toast" hidden></div>
<input type="file" id="imp" accept=".json,application/json" hidden>
<input type="file" id="photoInp" accept="image/*" hidden>

<script src="log.js"></script>
<script src="exercises.js"></script>
<script src="programs.js"></script>
<script src="body.js"></script>
<script src="tech.js"></script>
<script src="stretch.js"></script>
<script src="guide.js"></script>
<script src="analysis.js"></script>
<script src="app.js"></script>
<script src="sync.js"></script>
<script src="photoan.js"></script>
<script src="advice.js"></script>
<script src="tonnage.js"></script>
<script src="special.js"></script>
<script src="logview.js"></script>
<script src="web.js"></script>
<script src="context.js"></script>
<script src="gymtools.js"></script>
<script src="women.js"></script>
<script src="progpro.js"></script>
</body>
</html>
